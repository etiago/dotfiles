##### Better prefix #####

#set -g prefix C-a
#unbind C-b
#bind C-a send-prefix


##### Mouse #####

set -g mouse on

# Don't let dragging in a pane start text selection/copy mode
unbind -T root MouseDrag1Pane
unbind -T root MouseDragEnd1Pane


##### Large history #####

set -g history-limit 100000


##### Better colours #####

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:Tc"


##### Fast escape #####

set -sg escape-time 10


##### Split shortcuts #####

bind | split-window -h
bind - split-window -v


##### Vim keys #####

setw -g mode-keys vi


##### Easier reload #####

bind r source-file ~/.tmux.conf \; display "Reloaded!"


##### Window numbering #####

set -g base-index 1
setw -g pane-base-index 1


##### Copy mode #####

set -g copy-mode-line-numbers relative


##### Status Bar #####

set -g status-position bottom
set -g status-style "bg=black,fg=colour250"

# Session name
set -g status-left-length 100
set -g status-left "#[fg=colour39,bold][#S] "

# Nothing on the right
set -g status-right-length 100
set -g status-right ""

# Inactive windows
set -g window-status-format " #I:#W "
set -g window-status-style "fg=colour245,bg=black"

# Active window
set -g window-status-current-format " #I:#W "
set -g window-status-current-style "fg=black,bg=colour39,bold"

# No separators
set -g window-status-separator ""

# Pane border
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=colour39"

# Message colours
set -g message-style "fg=black,bg=colour39,bold"


##### Plugins #####

set -g @plugin 'tmux-plugins/tpm'

set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'laktak/extrakto'

run '~/.tmux/plugins/tpm/tpm'
